[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dl_fault_analysis"
version = "0.1.0"
description = "Deep learning architectures for fault analysis in power system protection."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "hydra-core>=1.3",
    "wandb>=0.16",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/julianoelhaf/dl_fault_analysis"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
